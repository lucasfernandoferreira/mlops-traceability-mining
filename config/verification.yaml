verification_policy_version: "1.3.0"
absolute_tolerance: 1.0e-12
quantile_method: linear
pre_restoration_criteria: [G00, G01, G02, G03, G04, G05, G06, G07, G08, G09, G10, G11, G12, G13]
final_criteria: [G00, G01, G02, G03, G04, G05, G06, G07, G08, G09, G10, G11, G12, G13, G14, G15]
allowed_not_applicable: []
required_scenarios:
  - four_commit_arithmetic
  - excluded_bot_and_merge
  - zero_config_magnitude
  - undefined_denominator
  - unavailable_is_null
  - duplicate_sha
  - historical_blob
  - review_identity_and_justification
  - review_source_hash
  - incomplete_criteria
# These are the first increment, not the complete G04 mutation suite.
initial_counterexamples:
  - wrong_code_denominator
  - omit_zero_magnitude_config
  - unavailable_to_zero
  - duplicate_commit
  - swap_evidence_blob
  - mutate_review_after_import
  - replace_review_round
  - force_partial_pass
codebook_source: docs/DECISOES_METODOLOGICAS.md
codebook:
  training_integration: "Entrada que registra ou invoca callback/logger habilitado."
  parameter_logging: "Valores ou configurações encaminhados a uma operação de registro."
  artifact_tracking: "Saída do processamento ligada a um artefato registrado."
  data_environment_reference: "Referências verificáveis a dados, versões ou dependências."
  integration_failure: "Falha descrita em código, teste ou discussão vinculada."
  configuration_refactoring: "Mudança de estrutura, caminho ou conteúdo de configuração."

# These components run on the explicit empirical index.
implemented_empirical_checks: [G03, G05, G06, G07, G08, G09, G10, G13]
source_checks:
  history: full_reachable_dag
  diff: raw_first_parent_no_renames
  config: paired_tree_reference
  object_integrity: sha1_header_and_content
  author_identity: lowercase_email_fallback_name_no_mailmap
  activity_excludes_large_commits: false
  parser_shared_dependency: PyYAML
additional_counterexamples:
  - include_bot_in_eligible_table
  - directory_sha_mislabeled_as_blob
  - missing_source_commit
  - boolean_flag_replaced_by_integer
  - incomplete_pr_response_to_absence
  - duplicate_pr_query_commit
  - swapped_pr_response_oid
  - changed_pr_association
  - changed_event_order_or_quota
  - duplicated_selected_event
  - missing_or_duplicate_case_template
qualitative_checks:
  associations: preserved_query_and_response_all_eligible_commits
  selection: git_rows_sorted_partitions_rational_positions
  incomplete_associations: fail_without_inferring_absence
  production_selection_imported: false
finalization_checks:
  receipt: explicit_empirical_exact_G00_G13
  claimed_pass: recompute_before_candidate
  package_status: candidate_pending_G14_G15
  final_acceptance: unavailable_until_restoration_and_manuscript_review
