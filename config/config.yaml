protocol:
  id: "TCC-MLOPS-TRACE-2026"
  version: "2.1.0"

execution:
  screening_workers: 4
  progress_interval_seconds: 10
  progress_stall_threshold_seconds: 60
  mlflow_manifest_scan_limit: 50

paths:
  raw_repositories: "data/raw/repos"
  interim: "data/interim"
  processed: "data/processed"
  manifests: "data/processed/manifests"
  reports: "reports"

github:
  token_environment_variable: "GITHUB_TOKEN"
  per_page: 100
  max_results_per_query: 1000
  request_timeout_seconds: 30

  rate_limit:
    code_search_reserve: 1
    core_reserve: 50
    reset_buffer_seconds: 2
    request_interval_seconds: 0.25
    secondary_cooldown_seconds: 60
    secondary_max_retries: 2
    max_rate_limit_wait_seconds: 300

  queries:
    - id: "dvc_pipeline"
      expression: "filename:dvc.yaml"

    - id: "dvc_files"
      expression: "extension:dvc"

    - id: "mlflow_python"
      expression: "mlflow language:Python"

    - id: "mlflow_import"
      expression: '"import mlflow" language:Python'

    - id: "mlflow_from_import"
      expression: '"from mlflow" language:Python'

    - id: "mlflow_pyproject"
      expression: "mlflow filename:pyproject.toml"

    - id: "mlflow_requirements"
      expression: "mlflow filename:requirements.txt"

    - id: "dvc_mlflow_pyproject"
      expression: "dvc mlflow filename:pyproject.toml"

    - id: "dvc_mlflow_requirements"
      expression: "dvc mlflow filename:requirements.txt"

    - id: "dvc_mlflow_python"
      expression: "dvc mlflow language:Python"

    - id: "dvc_mlflow_readme"
      expression: "dvc mlflow filename:README.md"

selection:
  min_candidates: 300
  min_commits: 300
  min_contributors: 5
  min_stars: 100
  active_after: "2025-09-01T00:00:00Z"
  min_shortlist: 10
  max_shortlist: 200
  final_sample_min: 3
  final_sample_max: 3
  exclude_forks: true
  exclude_archived: true
  forbidden_terms:
    - tutorial
    - course
    - classroom
    - homework
    - awesome-list
    - toy-project

strata:
  required:
    - apenas_mlflow

commit_filter:
  exclude_merges: true
  exclude_bots: true
  large_commit_max_files: 1000
  large_commit_action: "flag_and_skip"
  bot_patterns:
    - "[bot]"
    - dependabot
    - renovate
    - github-actions

taxonomy_validation:
  samples_per_category: 20
  minimum_agreement: 0.95
  calibration_units:
    - "ultralytics/ultralytics:ultralytics/cfg/default.yaml"

analysis:
  plan_version: "1.0.0"
  planned_at_utc: "2026-09-07T21:40:00Z"
  events_per_group: 5
  group_order: [Q1, Q2, Q3]
  fill_deficits: true
  quantile_method: linear
  concentration_top_fraction: 0.10
  figure_dpi: 300
  dataset_path_pattern: '(^|/)(datasets?|data)/'
  class_map_key: 'str:names'

reproducibility:
  require_clean_worktree: true
  save_manifests: true
  hash_algorithm: "sha256"
