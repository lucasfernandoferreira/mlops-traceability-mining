version: "1.2.0"
default_category: "OUTRO"

# DM-027: a 1.2.0 corrige os mecanismos das 16 divergências da validação da 1.1.0.
# As regras substituídas estão no histórico Git e em docs/DM027_TAXONOMIA_1_2_0.md.
rules:
  - category: "TEST"
    description: "Testes automatizados e fixtures."
    patterns:
      - '(^|/)tests?(/|$)'
      - '(^|/)(test_[^/]+|[^/]+_test)\.py$'

  - category: "CI"
    description: "Pipelines de integração e entrega."
    patterns:
      - '^\.github/workflows/'
      - '(^|/)\.gitlab-ci\.ya?ml$'
      - '(^|/)Jenkinsfile$'
      - '(^|/)azure-pipelines\.ya?ml$'

  - category: "ENV"
    description: "Ambiente, dependências e contêineres."
    patterns:
      - '(^|/)requirements[^/]*\.txt$'
      - '(^|/)pyproject\.toml$'
      - '(^|/)(poetry|uv)\.lock$'
      - '(^|/)Pipfile(\.lock)?$'
      - '(^|/)(environment|conda)[^/]*\.ya?ml$'
      - '(^|/)Dockerfile[^/]*$'
      - '[^/]\.dockerfile$'
      - '(^|/)docker-compose[^/]*\.ya?ml$'
      # Somente o script de empacotamento da raiz; setup.py internos continuam CODE.
      - '^setup\.(py|cfg)$'
      - '(^|/)package(-lock)?\.json$'
      - '(^|/)(yarn\.lock|pnpm-lock\.yaml)$'
      - '(^|/)Cargo\.(toml|lock)$'

  - category: "DATA_META"
    description: "Metadados de versionamento e pipeline DVC."
    patterns:
      - '\.dvc$'
      - '(^|/)dvc\.ya?ml$'
      - '(^|/)dvc\.lock$'

  - category: "CONFIG"
    description: "Parâmetros e configurações do pipeline."
    patterns:
      - '(^|/)params[^/]*\.ya?ml$'
      - '(^|/)MLproject$'
      - '(^|/)config[^/]*\.(ya?ml|json|toml)$'
      # Prefixo separado por _ ou -; arquivos ocultos de ferramentas ficam fora.
      - '(^|/)[^/.][^/]*[_-](config|params)\.(ya?ml|json|toml)$'
      - '(^|/)(cfg|configs?|config_files)/.*\.(ya?ml|json|toml)$'
      - '(^|/)(models?|datasets?)/.*\.ya?ml$'

  - category: "NOTEBOOK"
    description: "Notebooks versionados."
    patterns:
      - '\.ipynb$'

  - category: "CODE"
    description: "Código-fonte executável."
    patterns:
      - '\.(py|r|scala|java|kt|cpp|c|h|hpp|hh|hxx|cc|cxx|cu|rs|ts|tsx|js|jsx|mjs|cjs|sh|bash)$'

  - category: "DOC"
    description: "Documentação textual."
    patterns:
      - '(^|/)README(\.[^/]+)?$'
      # Formatos de dados sob docs/ não são documentação textual e seguem para DATA_RAW.
      - '^(?!.*\.(csv|tsv|parquet|feather|avro|nc)$)(.*/)?docs?/'
      - '\.(md|rst|adoc)$'

  - category: "DATA_RAW"
    description: "Arquivos de dados potencialmente pesados."
    patterns:
      - '\.(csv|tsv|parquet|feather|avro|nc)$'
      # Imagens de interface (ui/, icons/) são ativos visuais, não dados.
      - '^(?!(.*/)?(ui|icons)/).*\.(jpg|jpeg|png|wav|mp3|mp4)$'

  - category: "OUTRO"
    description: "Arquivos sem correspondência anterior."
    patterns: []
