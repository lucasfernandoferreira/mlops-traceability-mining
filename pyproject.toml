[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-traceability-mining"
version = "0.1.0"
description = "Reproducible mining pipeline for MLOps traceability research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Lucas Fernando Alves Ferreira" }
]
dependencies = [
    "GitPython>=3.1,<4",
    "PyGithub>=2,<3",
    "PyYAML>=6,<7",
    "pydantic>=2,<3",
    "pandas>=2,<3",
    "pyarrow>=17",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
    "mypy>=1.13,<2",
    "pip-tools>=7,<8",
    "types-PyYAML>=6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=mlops_traceability",
    "--cov-report=term-missing",
    "--cov-fail-under=90"
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "scripts", "tests"]
